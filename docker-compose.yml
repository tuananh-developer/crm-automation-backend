name: crm-automation

services:
  postgres:
    image: postgres:18.6
    container_name: crm_postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${LOCAL_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:-postgres}
      POSTGRES_DB: ${LOCAL_DB_NAME:-crm_backend}

    ports:
      - '${DB_PORT:-5432}:5432'

    volumes:
      - pgdata:/var/lib/postgresql

    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${LOCAL_DB_USER:-postgres} -d ${LOCAL_DB_NAME:-crm_backend}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.3.6-management-alpine
    container_name: crm_rabbitmq
    hostname: rabbitmq
    restart: unless-stopped

    environment:
      RABBITMQ_DEFAULT_USER: ${LOCAL_RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${LOCAL_RABBITMQ_PASSWORD:-guest}

    ports:
      - '${LOCAL_RABBITMQ_PORT:-5672}:5672'
      - '${LOCAL_RABBITMQ_MGMT_PORT:-15672}:15672'

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./docker/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./docker/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro

    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: crm_n8n
    restart: unless-stopped

    ports:
      - '${N8N_PORTS:-5678}:5678'

    environment:
      - GENERIC_TIMEZONE=Asia/Ho_Chi_Minh # Định múi giờ cho các node Schedule/Cron trong Workflow
      - TZ=Asia/Ho_Chi_Minh

      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_DATABASE=${N8N_DB_NAME:-crm_db}
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_USER=${LOCAL_DB_USER:-postgres}
      - DB_POSTGRESDB_PASSWORD=${LOCAL_DB_PASSWORD:-postgres}
      - N8N_BASIC_AUTH_ACTIVE=false
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-crm-automation-n8n-encryption-key-2026}
      - N8N_RUNNERS_ENABLED=false
      - NODE_OPTIONS=--max-old-space-size=384
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=24
      - EXECUTIONS_DATA_PRUNE_MAX_COUNT=500

      - NODE_ENV=production
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-1.5-pro}
      - BACKEND_INTERNAL_URL=${BACKEND_INTERNAL_URL:-http://host.docker.internal:3000}
      - N8N_API_KEY=${N8N_API_KEY}
      - N8N_WEBHOOK_SECRET=${N8N_WEBHOOK_SECRET}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  pgdata:
  rabbitmq_data:
  n8n_data:
