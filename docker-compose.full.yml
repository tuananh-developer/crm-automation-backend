services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crm_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PORT: 3000
      USE_LOCAL_DB: "true"
      USE_CLOUD_AMQP: "false"
      LOCAL_DB_HOST: postgres
      LOCAL_DB_PORT: 5432
      LOCAL_RABBITMQ_HOST: rabbitmq
      LOCAL_RABBITMQ_PORT: 5672
      N8N_BASE_URL: http://n8n:5678
      N8N_WEBHOOK_BASE_URL: http://n8n:5678/webhook
      N8N_WF10_WEBHOOK_URL: ""
      N8N_WF11_WEBHOOK_URL: ""
      N8N_WF12_WEBHOOK_URL: ""
      FRONTEND_URL: http://localhost:3001
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/v1/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s

  frontend:
    build:
      context: ../crm-automation-frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:3000/api/v1}
    container_name: crm_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3001}:3001"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 45s

  n8n:
    environment:
      - BACKEND_INTERNAL_URL=http://backend:3000
      - NODE_OPTIONS=--max-old-space-size=768
      - N8N_RUNNERS_MAX_OLD_SPACE_SIZE=256
