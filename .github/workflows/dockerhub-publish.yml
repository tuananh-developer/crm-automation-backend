name: Publish Backend Image and Deploy to EC2

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: crm-ec2-deploy-backend
  cancel-in-progress: false

jobs:
  publish:
    name: Publish versioned backend and deployment images
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
    steps:
      - name: Checkout the exact commit that passed CI
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Compute immutable image tag
        id: tag
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: echo "image_tag=sha-${HEAD_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract backend image metadata
        id: backend-meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/crm-automation-backend
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=sha-

      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.backend-meta.outputs.tags }}
          labels: ${{ steps.backend-meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract deployment bundle metadata
        id: config-meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/crm-automation-backend
          tags: |
            type=raw,value=config-latest
            type=sha,format=short,prefix=config-sha-

      - name: Build and push deployment bundle image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./deploy/Dockerfile.config
          platforms: linux/amd64
          push: true
          tags: ${{ steps.config-meta.outputs.tags }}
          labels: ${{ steps.config-meta.outputs.labels }}

  deploy:
    name: Deploy immutable image to EC2 through SSM
    needs: publish
    if: ${{ success() && vars.ENABLE_EC2_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Ensure this is still the latest main commit
        id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -Eeuo pipefail
          LATEST_MAIN_SHA="$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/heads/main" | jq -r '.object.sha')"
          if [[ "$LATEST_MAIN_SHA" != "$HEAD_SHA" ]]; then
            echo "Skipping stale deployment. CI passed for $HEAD_SHA but main is now $LATEST_MAIN_SHA."
            echo "is_current=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_current=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials
        if: steps.freshness.outputs.is_current == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify AWS identity
        if: steps.freshness.outputs.is_current == 'true'
        run: aws sts get-caller-identity

      - name: Install the matching deployment bundle and deploy backend
        if: steps.freshness.outputs.is_current == 'true'
        id: ssm
        env:
          INSTANCE_ID: ${{ vars.AWS_EC2_INSTANCE_ID }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ needs.publish.outputs.image_tag }}
        run: |
          set -Eeuo pipefail
          CONFIG_IMAGE="$DOCKERHUB_USERNAME/crm-automation-backend:config-$IMAGE_TAG"
          APP_IMAGE="$DOCKERHUB_USERNAME/crm-automation-backend:$IMAGE_TAG"
          SCRIPT=$(cat <<EOF
          set -Eeuo pipefail
          APP_DIR="/opt/crm-automation-backend"
          sudo mkdir -p "\$APP_DIR"
          sudo docker pull "$CONFIG_IMAGE"
          sudo docker run --rm -v "\$APP_DIR:/target" "$CONFIG_IMAGE"
          sudo test -s "$APP_DIR/deploy/.env.production"
          sudo docker pull "$APP_IMAGE"
          sudo bash "$APP_DIR/deploy/ssm-deploy-image.sh" backend "$IMAGE_TAG"
          EOF
          )
          PARAMETERS=$(jq -cn --arg command "$SCRIPT" '{commands: [$command]}')
          COMMAND_ID=$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --instance-ids "$INSTANCE_ID" \
            --comment "Deploy CRM backend $IMAGE_TAG" \
            --parameters "$PARAMETERS" \
            --timeout-seconds 900 \
            --query 'Command.CommandId' --output text)
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "Sent SSM command $COMMAND_ID for $INSTANCE_ID ($IMAGE_TAG)"

      - name: Wait for EC2 deployment result
        if: steps.freshness.outputs.is_current == 'true'
        env:
          INSTANCE_ID: ${{ vars.AWS_EC2_INSTANCE_ID }}
          COMMAND_ID: ${{ steps.ssm.outputs.command_id }}
        run: |
          set -Eeuo pipefail
          for attempt in $(seq 1 120); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || true)
            case "$STATUS" in
              Success)
                aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text
                exit 0
                ;;
              Failed|Cancelled|TimedOut|DeliveryTimedOut|ExecutionTimedOut|Undeliverable|Terminated)
                aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' --output json
                exit 1
                ;;
            esac
            sleep 5
          done
          echo "Timed out waiting for SSM command $COMMAND_ID" >&2
          exit 1
