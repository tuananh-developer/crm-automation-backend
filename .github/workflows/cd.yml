name: CD - Continuous Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify (Lint · Test · Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "store=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

      - name: Run Unit & Integration Tests
        run: pnpm test

      - name: Build Application
        run: pnpm build

  docker_publish:
    name: Build & Push Docker Image
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Trigger Production Deployment
    needs: docker_publish
    runs-on: ubuntu-latest
    steps:
      - name: Check Deployment Triggers
        id: deploy_check
        env:
          RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          SSH_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          if [ -n "$RENDER_HOOK" ]; then
            echo "mode=render" >> $GITHUB_OUTPUT
          elif [ -n "$SSH_HOST" ]; then
            echo "mode=ssh" >> $GITHUB_OUTPUT
          else
            echo "mode=ghcr_only" >> $GITHUB_OUTPUT
          fi

      - name: Deploy via Render Deploy Hook
        if: steps.deploy_check.outputs.mode == 'render'
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          echo "🚀 Triggering Render Deployment Hook..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "$RENDER_DEPLOY_HOOK_URL")
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "Response status: $HTTP_STATUS"
          echo "Response body: $BODY"
          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "::error::Render deployment hook failed with status $HTTP_STATUS"
            exit 1
          fi
          echo "✅ Render deployment successfully triggered!"

      - name: Deploy via SSH to Production Server
        if: steps.deploy_check.outputs.mode == 'ssh'
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.SERVER_DEPLOY_PATH || '/app/crm-automation-backend' }}
        run: |
          echo "🚀 Deploying to $SERVER_HOST via SSH..."
          mkdir -p ~/.ssh
          echo "$SERVER_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_HOST" << EOF
            cd $DEPLOY_PATH
            git pull origin main
            docker compose pull || true
            docker compose up -d --build
            echo "Deployment completed on remote server!"
          EOF

      - name: Summary & Instructions
        run: |
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          ## 🚀 Deployment Status

          - **Branch:** `${{ github.ref_name }}`
          - **Commit:** `${{ github.sha }}`
          - **Docker Image:** `ghcr.io/${{ github.repository }}:latest`

          ### 📦 Published Artifacts
          Docker container image has been built and pushed to **GitHub Container Registry (GHCR)**.

          ### ⚙️ Deployment Hooks
          - **Render Deploy Hook:** ${{ secrets.RENDER_DEPLOY_HOOK_URL != '' && '✅ Triggered' || '⚠️ Not configured (Add `RENDER_DEPLOY_HOOK_URL` in Repo Secrets)' }}
          - **SSH Server Deploy:** ${{ secrets.SERVER_HOST != '' && '✅ Triggered' || '⚠️ Not configured' }}
          EOF
